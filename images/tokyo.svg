<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#2a5ea8"/>
    <stop offset="62%"  stop-color="#6aacd8"/>
    <stop offset="100%" stop-color="#a8cce8"/>
  </linearGradient>
  <linearGradient id="proofgrd" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#7a1508"/>
    <stop offset="100%" stop-color="#5a0e06"/>
  </linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#c0b080"/>
    <stop offset="100%" stop-color="#a09060"/>
  </linearGradient>
</defs>

<!-- Sky -->
<rect width="800" height="440" fill="url(#sky)"/>

