<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440">
<defs>
  <linearGradient id="tsky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#04050f"/>
    <stop offset="55%"  stop-color="#0a0c22"/>
    <stop offset="100%" stop-color="#120a1e"/>
  </linearGradient>
  <radialGradient id="tglow" cx="50%" cy="100%" r="50%">
    <stop offset="0%" stop-color="#C0392B" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#C0392B" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="lanternglow" cx="50%" cy="72%" r="18%">
    <stop offset="0%" stop-color="#ff8822" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#ff8822" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="800" height="440" fill="url(#tsky)"/>
<rect width="800" height="440" fill="url(#tglow)"/>
<rect width="800" height="440" fill="url(#lanternglow)"/>

<!-- Stars -->
<circle cx="62"  cy="28"  r="1.2" fill="#e8dcc8" opacity="0.45"/>
<circle cx="185" cy="52"  r="1"   fill="#e8dcc8" opacity="0.4"/>
<circle cx="310" cy="18"  r="1.5" fill="#e8dcc8" opacity="0.48"/>
<circle cx="520" cy="38"  r="1"   fill="#e8dcc8" opacity="0.38"/>
<circle cx="680" cy="22"  r="1.2" fill="#e8dcc8" opacity="0.45"/>
<circle cx="755" cy="55"  r="1"   fill="#e8dcc8" opacity="0.35"/>
<circle cx="140" cy="78"  r="1"   fill="#e8dcc8" opacity="0.32"/>
<circle cx="620" cy="68"  r="1"   fill="#e8dcc8" opacity="0.35"/>

<!-- Far buildings left -->
<rect x="0"   y="270" width="48" height="170" fill="#0a0e22"/>
<rect x="52"  y="255" width="35" height="185" fill="#090c1e"/>
<rect x="90"  y="265" width="28" height="175" fill="#0a0e22"/>
<!-- Far buildings right -->
<rect x="625" y="262" width="45" height="178" fill="#0a0e22"/>
<rect x="672" y="250" width="32" height="190" fill="#090c1e"/>
<rect x="707" y="268" width="55" height="172" fill="#0a0e22"/>
<rect x="764" y="255" width="36" height="185" fill="#090c1e"/>

<!-- ===== SENSO-JI FIVE-STORY PAGODA ===== -->
<!-- Pagoda is center-right of frame -->
<!-- Ground -->
<rect x="440" y="405" width="80" height="5" fill="#080c1c"/>
<!-- Story 5 (bottom, widest) -->
<polygon points="445,405 448,365 516,365 519,405" fill="#0e1230"/>
<rect x="440" y="358" width="80" height="10" rx="1" fill="#0c1028"/>
<!-- Roof 5 - curved ends -->
<polygon points="432,360 480,340 528,360" fill="#0f1535"/>
<polygon points="432,360 480,344 528,360" fill="#0c1128"/>
<!-- Story 4 -->
<polygon points="456,358 459,326 521,326 524,358" fill="#0e1230"/>
<rect x="452" y="320" width="76" height="9" rx="1" fill="#0c1028"/>
<!-- Roof 4 -->
<polygon points="444,322 480,305 536,322" fill="#0f1535"/>
<polygon points="444,322 480,308 536,322" fill="#0c1128"/>
<!-- Story 3 -->
<polygon points="462,318 465,290 515,290 518,318" fill="#0e1230"/>
<rect x="458" y="284" width="64" height="8" rx="1" fill="#0c1028"/>
<!-- Roof 3 -->
<polygon points="450,286 480,271 510,286" fill="#0f1535"/>
<polygon points="450,286 480,274 510,286" fill="#0c1128"/>
<!-- Story 2 -->
<polygon points="464,280 467,256 513,256 516,280" fill="#0e1230"/>
<rect x="460" y="250" width="60" height="8" rx="1" fill="#0c1028"/>
<!-- Roof 2 -->
<polygon points="453,252 480,238 507,252" fill="#0f1535"/>
<polygon points="453,252 480,241 507,252" fill="#0c1128"/>
<!-- Story 1 (top) -->
<polygon points="466,246 469,228 511,228 514,246" fill="#0e1230"/>
<rect x="462" y="222" width="56" height="8" rx="1" fill="#0c1028"/>
<!-- Roof 1 (top, narrowest) -->
<polygon points="456,224 480,212 504,224" fill="#0f1535"/>
<polygon points="456,224 480,215 504,224" fill="#0c1128"/>
<!-- Spire (sorin) -->
<rect x="478" y="170" width="4"  height="44" fill="#0c1028"/>
<circle cx="480" cy="170" r="5"  fill="#0e1230"/>
<circle cx="480" cy="160" r="3"  fill="#0c1028"/>
<rect x="479"  y="140" width="2" height="22" fill="#0a0e22"/>
<!-- Pagoda warm glow from lantern light -->
<ellipse cx="480" cy="410" rx="55" ry="8" fill="#ff8822" opacity="0.12"/>

<!-- ===== KAMINARIMON GATE (Asakusa Thunder Gate) ===== -->
<!-- Gate is center-left, closer/larger -->
<!-- Gate posts -->
<rect x="165" y="280" width="18" height="155" rx="2" fill="#0c1028"/>
<rect x="310" y="280" width="18" height="155" rx="2" fill="#0c1028"/>
<!-- Top beam (massive, with curved ends) -->
<rect x="155" y="262" width="185" height="22" rx="3" fill="#0e1232"/>
<polygon points="150,262 160,245 330,245 340,262" fill="#0c1028"/>
<!-- Second beam below -->
<rect x="170" y="298" width="150" height="10" rx="2" fill="#0c1028"/>
<!-- ===== FAMOUS RED LANTERN ===== -->
<!-- Lantern hangs center between posts -->
<ellipse cx="248" cy="310" rx="28" ry="18" fill="#C0392B" opacity="0.88"/>
<ellipse cx="248" cy="308" rx="22" ry="14" fill="#d44020" opacity="0.7"/>
<rect x="245" y="292" width="6"  height="12" fill="#8a1a10" opacity="0.9"/>
<rect x="245" y="328" width="6"  height="12" fill="#8a1a10" opacity="0.9"/>
<!-- Lantern glow -->
<ellipse cx="248" cy="310" rx="48" ry="32" fill="#ff6611" opacity="0.15"/>
<ellipse cx="248" cy="310" rx="70" ry="50" fill="#ff8822" opacity="0.07"/>
<!-- Lantern kanji (風雷神門 simplified suggestion) -->
<text x="248" y="315" font-size="14" fill="#f5e6d3" fill-opacity="0.55" font-family="serif" text-anchor="middle" font-weight="bold">雷門</text>
<!-- Side lanterns (smaller) -->
<ellipse cx="192" cy="302" rx="12" ry="8"  fill="#C0392B" opacity="0.65"/>
<ellipse cx="304" cy="302" rx="12" ry="8"  fill="#C0392B" opacity="0.65"/>

<!-- Stone lanterns along path -->
<rect x="140" y="365" width="8" height="40" fill="#0a0d1e"/>
<rect x="136" y="362" width="16" height="5" rx="1" fill="#0c1028"/>
<rect x="138" y="355" width="12" height="8" rx="2" fill="#0a0d1e"/>
<rect x="140" y="350" width="8"  height="6"  fill="#f5e6d3" opacity="0.15"/>
<rect x="340" y="365" width="8"  height="40" fill="#0a0d1e"/>
<rect x="336" y="362" width="16" height="5"  rx="1" fill="#0c1028"/>
<rect x="338" y="355" width="12" height="8"  rx="2" fill="#0a0d1e"/>
<rect x="340" y="350" width="8"  height="6"  fill="#f5e6d3" opacity="0.15"/>

<!-- Cherry blossom trees flanking -->
<rect x="88"  y="310" width="8" height="95" fill="#0a0c1e" rx="2"/>
<circle cx="88"  cy="285" r="28" fill="#F4A7B9" opacity="0.62"/>
<circle cx="72"  cy="298" r="20" fill="#F8C5D1" opacity="0.52"/>
<circle cx="108" cy="292" r="22" fill="#F4A7B9" opacity="0.55"/>
<rect x="400" y="315" width="8" height="90" fill="#0a0c1e" rx="2"/>
<circle cx="405" cy="288" r="26" fill="#F4A7B9" opacity="0.58"/>
<circle cx="388" cy="300" r="18" fill="#F8C5D1" opacity="0.48"/>
<circle cx="424" cy="294" r="20" fill="#F4A7B9" opacity="0.52"/>

<!-- Floating petals -->
<ellipse cx="200" cy="195" rx="5" ry="3" fill="#F4A7B9" opacity="0.5" transform="rotate(20 200 195)"/>
<ellipse cx="320" cy="165" rx="4" ry="2.5" fill="#F8C5D1" opacity="0.45" transform="rotate(-15 320 165)"/>
<ellipse cx="145" cy="250" rx="5" ry="3" fill="#F4A7B9" opacity="0.4" transform="rotate(25 145 250)"/>
<ellipse cx="560" cy="210" rx="4" ry="2.5" fill="#F8C5D1" opacity="0.42" transform="rotate(-10 560 210)"/>

<!-- Ground / street -->
<rect x="0" y="418" width="800" height="22" fill="#060810"/>
<!-- Street lantern glow on ground -->
<ellipse cx="248" cy="420" rx="90" ry="10" fill="#ff8822" opacity="0.08"/>

</svg>
