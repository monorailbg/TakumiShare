<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#1a4a90"/>
    <stop offset="55%"  stop-color="#4a88c8"/>
    <stop offset="100%" stop-color="#88b8e0"/>
  </linearGradient>
  <linearGradient id="fuji" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#9098a8"/>
    <stop offset="62%"  stop-color="#788090"/>
    <stop offset="100%" stop-color="#606870"/>
  </linearGradient>
  <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#4a80b8"/>
    <stop offset="100%" stop-color="#305880"/>
  </linearGradient>
  <linearGradient id="treeline" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#357028"/>
    <stop offset="100%" stop-color="#254818"/>
  </linearGradient>
</defs>

<!-- Sky -->
<rect width="800" height="440" fill="url(#sky)"/>

<!-- Clouds -->
<ellipse cx="130" cy="52"  rx="85" ry="32" fill="#f8f8ff" opacity="0.92"/>
<ellipse cx="88"  cy="60"  rx="58" ry="25" fill="white"   opacity="0.9"/>
<ellipse cx="178" cy="58"  rx="62" ry="24" fill="white"   opacity="0.87"/>
<ellipse cx="220" cy="68"  rx="40" ry="18" fill="white"   opacity="0.75"/>
<ellipse cx="640" cy="44"  rx="92" ry="34" fill="#f8f8ff" opacity="0.9"/>
<ellipse cx="598" cy="53"  rx="62" ry="27" fill="white"   opacity="0.87"/>
<ellipse cx="688" cy="50"  rx="68" ry="26" fill="white"   opacity="0.85"/>
<ellipse cx="730" cy="62"  rx="42" ry="18" fill="white"   opacity="0.72"/>

<!-- Distant mountains (atmospheric haze) -->
<polygon points="0,300 55,238 120,268 190,205 265,248 335,195 410,240 480,192 555,235 625,188 700,228 770,195 800,212 800,300" fill="#7090b8" opacity="0.45"/>

<!-- ===== MOUNT FUJI ===== -->
<!-- Main body — iconic perfect cone -->
<polygon points="150,308 400,58 650,308" fill="url(#fuji)"/>
<!-- Slight shading on right side (shadow) -->
<polygon points="400,58 575,285 640,308" fill="#585f68" opacity="0.22"/>
<!-- Shading on left slope -->
<polygon points="400,58 225,285 175,308" fill="#a0a8b0" opacity="0.15"/>

<!-- Snow cap — very clean, iconic white -->
<!-- Main snow mass -->
<polygon points="358,158 400,58 442,158 430,152 418,168 400,155 382,168 370,152" fill="#f0eeeb"/>
<!-- Snow body fill -->
<polygon points="362,155 400,65 438,155 420,162 400,158 380,162" fill="#f5f3f0"/>
<!-- Snow shadow/depth on right -->
<polygon points="400,65 428,148 400,155 395,148" fill="#d8d5d0" opacity="0.7"/>
<!-- Snow on left (brighter, sun-lit) -->
<polygon points="400,65 372,148 400,155 405,148" fill="#f8f6f4" opacity="0.8"/>
<!-- Snow fingers running down upper slopes -->
<polygon points="400,155 397,185 400,188 403,185 406,155" fill="#f0eeeb" opacity="0.55"/>
<polygon points="382,163 378,192 381,194 384,192 386,165" fill="#f0eeeb" opacity="0.4"/>
<polygon points="418,163 414,192 417,194 420,192 422,165" fill="#f0eeeb" opacity="0.4"/>
<polygon points="370,148 364,175 368,177 371,175 373,150" fill="#f0eeeb" opacity="0.35"/>
<polygon points="430,148 427,175 430,177 433,175 436,150" fill="#f0eeeb" opacity="0.35"/>

<!-- Mid-range hills (green, closer) -->
<polygon points="0,305 0,268 70,235 145,270 220,230 300,262 380,240 400,252 420,240 500,258 580,228 658,265 735,232 800,262 800,305" fill="#3a6828"/>
<!-- Slightly darker near layer of hills -->
<polygon points="0,312 0,285 65,258 140,290 215,252 290,282 365,260 400,272 435,260 510,278 588,248 662,278 738,252 800,278 800,312" fill="#2e5520"/>

<!-- ===== LAKE KAWAGUCHIKO ===== -->
<rect x="0" y="310" width="800" height="68" fill="url(#lake)"/>
<!-- Lake surface shimmer -->
<rect x="50"  y="320" width="120" height="1.5" fill="white" opacity="0.15"/>
<rect x="200" y="332" width="180" height="1.5" fill="white" opacity="0.12"/>
<rect x="440" y="325" width="150" height="1.5" fill="white" opacity="0.15"/>
<rect x="620" y="335" width="130" height="1.5" fill="white" opacity="0.12"/>

<!-- Fuji reflection in lake -->
<polygon points="210,378 400,310 590,378 570,365 548,378 515,352 490,368 460,348 430,362 400,348 370,362 340,348 310,368 285,352 252,378 230,365" fill="#5888b8" opacity="0.55"/>
<!-- Snow cap reflection -->
<polygon points="370,312 400,322 430,312 418,318 400,325 382,318" fill="#c0cce0" opacity="0.35"/>

<!-- Treeline foreground (dark green) -->
<polygon points="0,310 0,293 12,283 23,293 35,280 49,290 61,278 76,288 88,276 103,286 117,277 131,287 145,278 160,288 173,279 188,289 202,280 217,290 232,281 248,291 263,278 278,288 294,280 310,290 326,278 342,288 358,279 374,289 390,280 400,290 410,280 426,290 442,279 458,289 474,280 490,290 505,278 519,288 534,279 549,289 563,278 577,288 591,279 605,289 619,278 633,288 647,279 660,289 674,278 688,288 700,279 714,289 728,278 742,288 755,279 770,289 785,278 800,288 800,310" fill="url(#treeline)"/>

<!-- ===== TORII GATE (lakeside) ===== -->
<rect x="376" y="258" width="9"  height="56" fill="#9a1808" opacity="0.9" rx="2"/>
<rect x="415" y="258" width="9"  height="56" fill="#9a1808" opacity="0.9" rx="2"/>
<path d="M368,271 Q400,260 432,271" stroke="#9a1808" stroke-width="10" fill="none" opacity="0.9" stroke-linecap="round"/>
<rect x="372" y="284" width="56" height="7" fill="#9a1808" opacity="0.88" rx="2"/>
<!-- Torii reflection -->
<rect x="376" y="312" width="9"  height="28" fill="#6080a8" opacity="0.35" rx="1"/>
<rect x="415" y="312" width="9"  height="28" fill="#6080a8" opacity="0.35" rx="1"/>

<!-- Cherry blossoms near lakeside -->
<rect x="105" y="270" width="10" height="42" fill="#6a4020" rx="2"/>
<circle cx="108" cy="250" r="28" fill="#F4A7B9" opacity="0.75"/>
<circle cx="92"  cy="262" r="20" fill="#F8C5D1" opacity="0.68"/>
<circle cx="128" cy="258" r="22" fill="#F4A7B9" opacity="0.68"/>

<rect x="672" y="274" width="10" height="38" fill="#6a4020" rx="2"/>
<circle cx="678" cy="255" r="26" fill="#F4A7B9" opacity="0.72"/>
<circle cx="660" cy="267" r="18" fill="#F8C5D1" opacity="0.65"/>
<circle cx="698" cy="262" r="20" fill="#F4A7B9" opacity="0.65"/>

<!-- Shore / grass -->
<rect x="0" y="378" width="800" height="62" fill="#3a6020"/>
<!-- Path near shore -->
<rect x="300" y="378" width="200" height="62" fill="#8a9878"/>

</svg>
