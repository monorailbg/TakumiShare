<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440">
<defs>
  <linearGradient id="msky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#03040e"/>
    <stop offset="35%"  stop-color="#080a20"/>
    <stop offset="65%"  stop-color="#0e0820"/>
    <stop offset="100%" stop-color="#180c28"/>
  </linearGradient>
  <radialGradient id="moonhalo" cx="72%" cy="16%" r="16%">
    <stop offset="0%"   stop-color="#F5E6D3" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#F5E6D3" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sunrise" cx="50%" cy="100%" r="42%">
    <stop offset="0%"   stop-color="#C0392B" stop-opacity="0.15"/>
    <stop offset="60%"  stop-color="#8b1a10" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#8b1a10" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#06081a"/>
    <stop offset="100%" stop-color="#03040e"/>
  </linearGradient>
</defs>

<rect width="800" height="440" fill="url(#msky)"/>
<rect width="800" height="440" fill="url(#moonhalo)"/>
<rect width="800" height="440" fill="url(#sunrise)"/>

<!-- Moon -->
<circle cx="576" cy="64"  r="26" fill="#F5E6D3" opacity="0.16"/>
<circle cx="576" cy="64"  r="19" fill="#F5E6D3" opacity="0.13"/>
<circle cx="576" cy="64"  r="12" fill="#F5E6D3" opacity="0.15"/>

<!-- Stars -->
<circle cx="42"  cy="45"  r="1.5" fill="#e8dcc8" opacity="0.55"/>
<circle cx="118" cy="28"  r="1"   fill="#e8dcc8" opacity="0.48"/>
<circle cx="220" cy="52"  r="1.5" fill="#e8dcc8" opacity="0.42"/>
<circle cx="312" cy="22"  r="1"   fill="#e8dcc8" opacity="0.5"/>
<circle cx="415" cy="48"  r="1.2" fill="#e8dcc8" opacity="0.38"/>
<circle cx="488" cy="18"  r="1"   fill="#e8dcc8" opacity="0.48"/>
<circle cx="658" cy="38"  r="1.5" fill="#e8dcc8" opacity="0.42"/>
<circle cx="738" cy="55"  r="1"   fill="#e8dcc8" opacity="0.45"/>
<circle cx="80"  cy="100" r="1"   fill="#e8dcc8" opacity="0.32"/>
<circle cx="350" cy="82"  r="1"   fill="#e8dcc8" opacity="0.35"/>
<circle cx="700" cy="92"  r="1.2" fill="#e8dcc8" opacity="0.32"/>

<!-- Far mountains (lighter silhouette) -->
<polygon points="0,310 60,208 130,252 210,172 290,228 370,162 450,210 530,172 610,218 680,175 750,215 800,198 800,310" fill="#1e2250"/>

<!-- ===== MOUNT FUJI (iconic symmetrical cone) ===== -->
<!-- Fuji base -->
<polygon points="160,310 400,72 640,310" fill="#141830"/>
<!-- Fuji main body (slightly lighter) -->
<polygon points="175,310 400,78 625,310" fill="#181e3a"/>
<!-- Snow cap -->
<polygon points="355,165 400,78 445,165 432,158 420,172 400,155 380,172 368,158" fill="#e8dcc8" opacity="0.82"/>
<!-- Snow cap shadow/depth -->
<polygon points="400,78 430,150 400,140 370,150" fill="#d8ccb8" opacity="0.65"/>
<!-- Snow streaks down upper slope -->
<polygon points="400,140 395,175 398,178 404,175 406,140" fill="#e8dcc8" opacity="0.3"/>
<polygon points="380,158 374,188 377,190 382,188 385,160" fill="#e8dcc8" opacity="0.22"/>
<polygon points="420,158 415,188 418,190 423,188 426,160" fill="#e8dcc8" opacity="0.22"/>

<!-- Mid-range hills flanking Fuji -->
<polygon points="0,310 0,270 100,230 200,268 300,242 380,270 400,285 420,270 500,238 600,265 700,232 800,268 800,310" fill="#10132a"/>

<!-- Lake Kawaguchiko (foreground) -->
<rect x="0" y="308" width="800" height="68" fill="url(#lake)"/>
<!-- Lake shoreline edge -->
<path d="M0,308 Q100,303 200,308 Q300,313 400,308 Q500,303 600,308 Q700,313 800,308" fill="#06081a"/>

<!-- Fuji reflection in lake (upside down, distorted) -->
<polygon points="280,375 400,308 520,375 510,368 498,378 470,358 450,372 430,360 400,372 370,360 350,372 330,358 310,372 302,368" fill="#1a1e3a" opacity="0.6"/>
<!-- Snow cap reflection -->
<polygon points="380,310 400,320 420,310 415,315 400,322 385,315" fill="#e8dcc8" opacity="0.18"/>
<!-- Moon reflection in lake -->
<ellipse cx="576" cy="345" rx="14" ry="4" fill="#F5E6D3" opacity="0.1"/>

<!-- Treeline foreground -->
<polygon points="0,308 0,295 12,285 22,295 34,282 48,292 60,280 74,290 86,278 100,288 114,279 128,289 142,280 156,290 168,281 182,291 194,282 208,292 222,283 236,293 250,280 264,290 278,283 292,293 305,281 318,291 332,283 346,293 360,281 374,291 388,283 400,293 412,283 426,293 440,281 454,291 468,283 482,293 494,281 508,291 522,283 536,293 550,281 564,291 578,283 592,293 606,281 618,291 632,283 646,293 660,281 674,291 688,283 700,293 714,281 728,291 742,283 756,293 768,281 782,291 800,283 800,308" fill="#080a1c"/>

<!-- ===== TORII GATE at lake edge ===== -->
<rect x="376" y="258" width="8"  height="52" fill="#1e0c08" opacity="0.85" rx="2"/>
<rect x="416" y="258" width="8"  height="52" fill="#1e0c08" opacity="0.85" rx="2"/>
<path d="M368,270 Q400,260 432,270" stroke="#1e0c08" stroke-width="9" fill="none" opacity="0.85" stroke-linecap="round"/>
<rect x="372" y="283" width="56" height="6" fill="#1e0c08" opacity="0.85" rx="2"/>
<!-- Torii reflection in lake -->
<rect x="376" y="308" width="8"  height="22" fill="#1e0c08" opacity="0.25" rx="1"/>
<rect x="416" y="308" width="8"  height="22" fill="#1e0c08" opacity="0.25" rx="1"/>

</svg>
