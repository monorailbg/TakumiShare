<rect x="327" y="262" width="26" height="2" fill="#4488ff" opacity="0.22"/>
<rect x="336" y="168" width="8"  height="1" fill="#6699ff" opacity="0.35"/>

<!-- ===================== TOKYO TOWER ===================== -->
<!-- Outer frame -->
