    <stop offset="50%" stop-color="#06091e"/>
    <stop offset="82%" stop-color="#100820"/>
    <stop offset="100%" stop-color="#1a0c18"/>
  </linearGradient>
  <radialGradient id="hglow" cx="50%" cy="98%" r="55%">
    <stop offset="0%" stop-color="#C0392B" stop-opacity="0.2"/>
    <stop offset="50%" stop-color="#8b1a10" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#8b1a10" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="skytreeglow" cx="28%" cy="18%" r="12%">
    <stop offset="0%" stop-color="#3366ee" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#3366ee" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="towerglow" cx="67%" cy="42%" r="9%">
    <stop offset="0%" stop-color="#ff5522" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#ff5522" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#07091c"/>
    <stop offset="100%" stop-color="#020306"/>
  </linearGradient>
</defs>

