<!-- ===================== TOKYO SKYTREE ===================== -->
<!-- Base tripod legs -->
<polygon points="308,800 332,555 340,555 364,800" fill="#090d22" opacity="0.92"/>
<polygon points="316,800 334,558 346,558 360,800" fill="#0d1432" opacity="0.88"/>
<!-- Main shaft - concave taper (distinctive Skytree profile) -->
<polygon points="326,800 336,480 344,480 354,800" fill="#101840"/>
<!-- Shaft narrows above mid-point -->
<polygon points="333,480 337,350 343,350 347,480" fill="#0f1638"/>
<!-- Observation deck 1 (~y=370, flared bulge) -->
<rect x="326" y="355" width="28" height="20" rx="3" fill="#0d1432"/>
<rect x="324" y="353" width="32" height="6"  rx="2" fill="#10163a"/>
<rect x="324" y="371" width="32" height="4"  rx="1" fill="#10163a"/>
