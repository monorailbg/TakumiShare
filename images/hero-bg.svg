<polygon points="330,351 335,265 345,265 350,351" fill="#0f1638"/>
<!-- Observation deck 2 (~y=268) -->
<rect x="328" y="256" width="24" height="14" rx="2" fill="#0d1432"/>
<rect x="326" y="254" width="28" height="5"  rx="1" fill="#10163a"/>
<!-- Upper shaft -->
<rect x="337" y="160" width="6"  height="98"  fill="#0e1535"/>
<!-- Antenna spire -->
<rect x="339" y="92"  width="2"  height="70"  fill="#0b1028"/>
