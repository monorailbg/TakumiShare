<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#2858a8"/>
    <stop offset="58%"  stop-color="#60a0d0"/>
    <stop offset="100%" stop-color="#90c0e0"/>
  </linearGradient>
  <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#3a7030"/>
    <stop offset="100%" stop-color="#2a5020"/>
  </linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#8a9870"/>
    <stop offset="100%" stop-color="#6a7850"/>
  </linearGradient>
</defs>

<!-- Sky -->
<rect width="800" height="440" fill="url(#sky)"/>

<!-- Clouds -->
<ellipse cx="120" cy="55"  rx="80" ry="30" fill="#f8f8ff" opacity="0.9"/>
<ellipse cx="80"  cy="62"  rx="52" ry="24" fill="white"   opacity="0.88"/>
<ellipse cx="165" cy="60"  rx="58" ry="22" fill="white"   opacity="0.85"/>
<ellipse cx="620" cy="40"  rx="95" ry="35" fill="#f8f8ff" opacity="0.88"/>
<ellipse cx="575" cy="50"  rx="65" ry="27" fill="white"   opacity="0.85"/>
<ellipse cx="672" cy="46"  rx="68" ry="26" fill="white"   opacity="0.82"/>

<!-- Background green hills (Kamakura is surrounded by wooded hills) -->
<polygon points="0,290 80,220 180,258 270,195 370,240 460,192 560,235 650,188 750,228 800,210 800,290" fill="#4a8840" opacity="0.85"/>
<polygon points="0,310 60,250 155,285 250,222 350,268 450,218 548,260 645,210 740,248 800,232 800,310" fill="url(#hills)"/>

<!-- Trees flanking the Buddha -->
<rect x="30"  y="240" width="18" height="140" fill="#2a4818" rx="3"/>
<ellipse cx="40"  cy="218" rx="42" ry="32"  fill="#3a7828"/>
<ellipse cx="24"  cy="232" rx="32" ry="26"  fill="#4a8838"/>
<ellipse cx="60"  cy="225" rx="36" ry="28"  fill="#357025"/>
<rect x="95"  y="252" width="15" height="125" fill="#2a4818" rx="2"/>
<ellipse cx="102" cy="234" rx="34" ry="27"  fill="#4a8838"/>

<rect x="690" y="245" width="18" height="135" fill="#2a4818" rx="3"/>
<ellipse cx="700" cy="224" rx="40" ry="30"  fill="#3a7828"/>
<ellipse cx="684" cy="236" rx="30" ry="24"  fill="#357025"/>
<rect x="738" y="255" width="15" height="122" fill="#2a4818" rx="2"/>
<ellipse cx="745" cy="238" rx="34" ry="26"  fill="#4a8838"/>

<!-- Cedar trees behind Buddha -->
<rect x="150" y="230" width="14" height="150" fill="#2a4018" rx="2"/>
<polygon points="142,232 157,175 172,232" fill="#3a6028"/>
<polygon points="145,258 157,210 169,258" fill="#4a7030"/>
<rect x="620" y="238" width="14" height="140" fill="#2a4018" rx="2"/>
<polygon points="612,240 627,183 642,240" fill="#3a6028"/>
<polygon points="615,266 627,218 639,266" fill="#4a7030"/>

<!-- ===== GREAT BUDDHA (Kotoku-in Daibutsu) — DAYTIME ===== -->
<!-- He sits on a lotus throne outdoors, no building around him -->

<!-- Lotus throne -->
<ellipse cx="400" cy="418" rx="115" ry="22" fill="#7a8060"/>
<rect x="300" y="402" width="200" height="20" fill="#8a9068" rx="4"/>
<!-- Lotus petal suggestions -->
<ellipse cx="340" cy="402" rx="28" ry="10" fill="#9aa078"/>
<ellipse cx="400" cy="400" rx="28" ry="10" fill="#9aa078"/>
<ellipse cx="460" cy="402" rx="28" ry="10" fill="#9aa078"/>

<!-- Lower robe / seated body -->
<!-- Wide base of seated figure -->
<path d="M285,402 Q280,348 302,290 Q332,238 400,222 Q468,238 498,290 Q520,348 515,402 Z" fill="#6a8870"/>
<!-- Robe folds (subtle darker lines) -->
<path d="M318,370 Q360,360 400,362 Q440,360 482,370" stroke="#4a6848" stroke-width="3" fill="none" opacity="0.65"/>
<path d="M310,390 Q360,380 400,382 Q440,380 490,390" stroke="#4a6848" stroke-width="2.5" fill="none" opacity="0.55"/>
<path d="M295,405 Q350,395 400,397 Q450,395 505,405" stroke="#4a6848" stroke-width="2" fill="none" opacity="0.45"/>

<!-- Chest / collar area -->
<path d="M335,295 Q368,280 400,278 Q432,280 465,295 Q460,312 400,318 Q340,312 335,295 Z" fill="#7a9878"/>

<!-- Meditation hands (dhyana mudra) -->
<ellipse cx="370" cy="368" rx="38" ry="17" fill="#608068"/>
<ellipse cx="430" cy="368" rx="38" ry="17" fill="#608068"/>
<ellipse cx="400" cy="363" rx="44" ry="19" fill="#6a8870"/>
<!-- Finger detail -->
<path d="M360,362 Q380,358 400,360 Q420,358 440,362" stroke="#507060" stroke-width="2" fill="none" opacity="0.5"/>

<!-- Neck -->
<rect x="382" y="250" width="36" height="32" fill="#6a8870" rx="7"/>

<!-- Head — main oval -->
<ellipse cx="400" cy="218" rx="58" ry="64" fill="#7a9878"/>
<!-- Face plane (slightly lighter, more forward) -->
<ellipse cx="400" cy="224" rx="44" ry="50" fill="#82a082"/>

<!-- Ushnisha -->
<ellipse cx="400" cy="158" rx="28" ry="24" fill="#6a8870"/>
<ellipse cx="400" cy="153" rx="22" ry="18" fill="#7a9878"/>
<!-- Spiral curls (symbolic) -->
<circle cx="400" cy="150" r="5"  fill="#5a7858" opacity="0.65"/>
<circle cx="388" cy="157" r="4"  fill="#5a7858" opacity="0.55"/>
<circle cx="412" cy="157" r="4"  fill="#5a7858" opacity="0.55"/>
<circle cx="395" cy="164" r="3.5" fill="#5a7858" opacity="0.5"/>
<circle cx="405" cy="164" r="3.5" fill="#5a7858" opacity="0.5"/>

<!-- Elongated ears -->
<ellipse cx="344" cy="228" rx="11" ry="28" fill="#6a8870"/>
<ellipse cx="456" cy="228" rx="11" ry="28" fill="#6a8870"/>

<!-- Eyes — serene, half-closed -->
<path d="M374,220 Q388,215 400,217 Q412,215 426,220" stroke="#2a3828" stroke-width="2.5" fill="none" opacity="0.7"/>
<!-- Pupils / irises -->
<ellipse cx="387" cy="221" rx="5" ry="4" fill="#2a3828" opacity="0.55"/>
<ellipse cx="413" cy="221" rx="5" ry="4" fill="#2a3828" opacity="0.55"/>

<!-- Slight serene smile -->
<path d="M386,244 Q400,250 414,244" stroke="#2a3828" stroke-width="2" fill="none" opacity="0.5"/>

<!-- Nose -->
<path d="M396,230 Q400,237 404,230" stroke="#3a4838" stroke-width="1.5" fill="none" opacity="0.5"/>

<!-- Brow lines -->
<path d="M372,208 Q386,203 398,206" stroke="#2a3828" stroke-width="1.8" fill="none" opacity="0.55"/>
<path d="M402,206 Q414,203 428,208" stroke="#2a3828" stroke-width="1.8" fill="none" opacity="0.55"/>

<!-- Urna (forehead dot) -->
<circle cx="400" cy="205" r="3.5" fill="#4a6058" opacity="0.65"/>

<!-- Cherry blossoms -->
<rect x="108" y="288" width="10" height="115" fill="#5a3818" rx="3"/>
<circle cx="110" cy="262" r="32" fill="#F4A7B9" opacity="0.72"/>
<circle cx="92"  cy="275" r="24" fill="#F8C5D1" opacity="0.65"/>
<circle cx="132" cy="270" r="27" fill="#F4A7B9" opacity="0.65"/>
<circle cx="118" cy="280" r="20" fill="#F8C5D1" opacity="0.55"/>

<rect x="672" y="295" width="10" height="105" fill="#5a3818" rx="3"/>
<circle cx="678" cy="270" r="29" fill="#F4A7B9" opacity="0.68"/>
<circle cx="660" cy="282" r="22" fill="#F8C5D1" opacity="0.62"/>
<circle cx="698" cy="278" r="24" fill="#F4A7B9" opacity="0.62"/>

<!-- Floating petals -->
<ellipse cx="220" cy="182" rx="5" ry="3" fill="#F4A7B9" opacity="0.55" transform="rotate(22 220 182)"/>
<ellipse cx="305" cy="148" rx="4" ry="2.5" fill="#F8C5D1" opacity="0.5" transform="rotate(-15 305 148)"/>
<ellipse cx="565" cy="165" rx="5" ry="3" fill="#F4A7B9" opacity="0.5" transform="rotate(28 565 165)"/>
<ellipse cx="635" cy="208" rx="4" ry="2.5" fill="#F8C5D1" opacity="0.55" transform="rotate(-10 635 208)"/>

<!-- Ground / paved area -->
<rect x="0" y="400" width="800" height="40" fill="url(#ground)"/>
<!-- Stone path to Buddha -->
<rect x="280" y="400" width="240" height="40" fill="#9aa880"/>
<!-- Path joints -->
<rect x="280" y="415" width="240" height="1" fill="#7a8860" opacity="0.5"/>

<!-- Visitors (small silhouettes) -->
<rect x="260" y="378" width="6" height="22" rx="2" fill="#4a3828" opacity="0.55"/>
<circle cx="263" cy="373" r="5" fill="#4a3828" opacity="0.55"/>
<rect x="525" y="380" width="6" height="20" rx="2" fill="#3a2820" opacity="0.5"/>
<circle cx="528" cy="375" r="5" fill="#3a2820" opacity="0.5"/>

</svg>
