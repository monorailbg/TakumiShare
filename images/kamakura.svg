<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440">
<defs>
  <linearGradient id="ksky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#08091e"/>
    <stop offset="38%"  stop-color="#14102e"/>
    <stop offset="68%"  stop-color="#3a1418"/>
    <stop offset="100%" stop-color="#1e0808"/>
  </linearGradient>
  <radialGradient id="ksun" cx="68%" cy="95%" r="30%">
    <stop offset="0%"   stop-color="#e06010" stop-opacity="0.42"/>
    <stop offset="50%"  stop-color="#8b2a08" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#8b2a08" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="moonk" cx="18%" cy="12%" r="10%">
    <stop offset="0%"   stop-color="#F5E6D3" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#F5E6D3" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="800" height="440" fill="url(#ksky)"/>
<rect width="800" height="440" fill="url(#ksun)"/>
<rect width="800" height="440" fill="url(#moonk)"/>

<!-- Moon -->
<circle cx="145" cy="52"  r="18" fill="#F5E6D3" opacity="0.14"/>
<circle cx="145" cy="52"  r="12" fill="#F5E6D3" opacity="0.12"/>

<!-- Stars -->
<circle cx="55"  cy="35"  r="1.2" fill="#e8dcc8" opacity="0.45"/>
<circle cx="185" cy="22"  r="1"   fill="#e8dcc8" opacity="0.4"/>
<circle cx="280" cy="48"  r="1.5" fill="#e8dcc8" opacity="0.42"/>
<circle cx="380" cy="18"  r="1"   fill="#e8dcc8" opacity="0.38"/>
<circle cx="480" cy="42"  r="1.2" fill="#e8dcc8" opacity="0.35"/>
<circle cx="620" cy="28"  r="1"   fill="#e8dcc8" opacity="0.42"/>
<circle cx="735" cy="55"  r="1.5" fill="#e8dcc8" opacity="0.38"/>

<!-- Background hills -->
<polygon points="0,310 80,235 180,275 280,205 380,255 460,210 560,248 660,205 760,240 800,225 800,310" fill="#1c1435"/>

<!-- Ground -->
<ellipse cx="400" cy="475" rx="600" ry="110" fill="#0a0500"/>

<!-- ===== GREAT BUDDHA (Kotoku-in) ===== -->
<!-- He's seated on a lotus throne, centered -->

<!-- Lotus throne base -->
<ellipse cx="400" cy="415" rx="105" ry="20" fill="#0d0804"/>
<rect x="310" y="400" width="180" height="18" fill="#0d0804" rx="4"/>
<!-- Lotus petals suggestion -->
<ellipse cx="350" cy="400" rx="22" ry="8"  fill="#120b06"/>
<ellipse cx="400" cy="398" rx="22" ry="8"  fill="#120b06"/>
<ellipse cx="450" cy="400" rx="22" ry="8"  fill="#120b06"/>

<!-- Robe / lower body (wide seated base) -->
<path d="M295,400 Q290,350 310,295 Q340,240 400,225 Q460,240 490,295 Q510,350 505,400 Z" fill="#12100a"/>

<!-- Stomach/lower robe folds -->
<path d="M320,370 Q360,360 400,362 Q440,360 480,370" stroke="#0c0e08" stroke-width="3" fill="none" opacity="0.7"/>
<path d="M315,390 Q360,380 400,382 Q440,380 485,390" stroke="#0c0e08" stroke-width="2.5" fill="none" opacity="0.6"/>

<!-- Robe collar/chest -->
<path d="M340,300 Q370,285 400,282 Q430,285 460,300 Q455,315 400,320 Q345,315 340,300 Z" fill="#151210"/>

<!-- Hands in dhyana mudra (meditation gesture, resting in lap) -->
<ellipse cx="380" cy="365" rx="35" ry="16" fill="#100d08"/>
<ellipse cx="420" cy="365" rx="35" ry="16" fill="#100d08"/>
<ellipse cx="400" cy="360" rx="40" ry="18" fill="#12100a"/>

<!-- Neck -->
<rect x="382" y="252" width="36" height="34" fill="#12100a" rx="6"/>

<!-- Head - Buddha is known for serene expression -->
<ellipse cx="400" cy="222" rx="56" ry="62" fill="#14110a"/>
<!-- Face plane lighter -->
<ellipse cx="400" cy="228" rx="42" ry="48" fill="#161310"/>

<!-- Ushnisha (topknot) -->
<ellipse cx="400" cy="163" rx="26" ry="22" fill="#14110a"/>
<ellipse cx="400" cy="158" rx="20" ry="16" fill="#161310"/>
<!-- Spiral curls on ushnisha (symbolic) -->
<circle cx="400" cy="155" r="4"  fill="#111008" opacity="0.6"/>
<circle cx="388" cy="162" r="3"  fill="#111008" opacity="0.5"/>
<circle cx="412" cy="162" r="3"  fill="#111008" opacity="0.5"/>

<!-- Ears (elongated, symbolic) -->
<ellipse cx="346" cy="228" rx="10" ry="26" fill="#13100a"/>
<ellipse cx="454" cy="228" rx="10" ry="26" fill="#13100a"/>

<!-- Serene eyes (half-closed) -->
<path d="M378,224 Q390,220 400,222 Q410,220 422,224" stroke="#0a0806" stroke-width="2.5" fill="none" opacity="0.6"/>
<!-- Slight smile -->
<path d="M388,242 Q400,248 412,242" stroke="#0a0806" stroke-width="2" fill="none" opacity="0.45"/>

<!-- Eyebrows -->
<path d="M376,212 Q388,208 398,210" stroke="#0c0a06" stroke-width="1.8" fill="none" opacity="0.55"/>
<path d="M402,210 Q412,208 424,212" stroke="#0c0a06" stroke-width="1.8" fill="none" opacity="0.55"/>

<!-- Nose -->
<ellipse cx="400" cy="232" rx="5" ry="7" fill="#100e08" opacity="0.4"/>

<!-- Forehead dot (urna) -->
<circle cx="400" cy="208" r="3" fill="#181410" opacity="0.6"/>

<!-- ===== CHERRY BLOSSOM TREES ===== -->
<!-- Left tree -->
<rect x="105" y="300" width="12" height="130" fill="#0e0b06" rx="3"/>
<rect x="96"  y="300" width="6"  height="90"  fill="#0e0b06" rx="2" transform="rotate(-20 105 300)"/>
<rect x="112" y="288" width="6"  height="78"  fill="#0e0b06" rx="2" transform="rotate(18 116 288)"/>
<circle cx="102" cy="255" r="34" fill="#F4A7B9" opacity="0.72"/>
<circle cx="128" cy="240" r="28" fill="#F8C5D1" opacity="0.65"/>
<circle cx="86"  cy="270" r="24" fill="#F4A7B9" opacity="0.62"/>
<circle cx="140" cy="265" r="20" fill="#F8C5D1" opacity="0.55"/>
<circle cx="112" cy="262" r="26" fill="#F4A7B9" opacity="0.5"/>
<!-- Right tree -->
<rect x="675" y="310" width="12" height="120" fill="#0e0b06" rx="3"/>
<rect x="666" y="310" width="6"  height="82"  fill="#0e0b06" rx="2" transform="rotate(-16 675 310)"/>
<rect x="682" y="298" width="6"  height="70"  fill="#0e0b06" rx="2" transform="rotate(20 686 298)"/>
<circle cx="682" cy="265" r="30" fill="#F4A7B9" opacity="0.68"/>
<circle cx="658" cy="278" r="25" fill="#F8C5D1" opacity="0.62"/>
<circle cx="706" cy="275" r="22" fill="#F4A7B9" opacity="0.58"/>
<circle cx="668" cy="270" r="24" fill="#F8C5D1" opacity="0.52"/>

<!-- Floating petals -->
<ellipse cx="225" cy="185" rx="5" ry="3" fill="#F4A7B9" opacity="0.55" transform="rotate(22 225 185)"/>
<ellipse cx="310" cy="148" rx="4" ry="2.5" fill="#F8C5D1" opacity="0.5" transform="rotate(-18 310 148)"/>
<ellipse cx="555" cy="168" rx="5" ry="3" fill="#F4A7B9" opacity="0.5" transform="rotate(28 555 168)"/>
<ellipse cx="635" cy="210" rx="4" ry="2.5" fill="#F8C5D1" opacity="0.55" transform="rotate(-12 635 210)"/>
<ellipse cx="185" cy="310" rx="4" ry="2.5" fill="#F4A7B9" opacity="0.42" transform="rotate(15 185 310)"/>
<ellipse cx="608" cy="305" rx="5" ry="3" fill="#F8C5D1" opacity="0.42" transform="rotate(-22 608 305)"/>
<ellipse cx="355" cy="120" rx="4" ry="2.5" fill="#F4A7B9" opacity="0.38" transform="rotate(10 355 120)"/>

<!-- Ground grass/path -->
<ellipse cx="400" cy="418" rx="260" ry="18" fill="#090602" opacity="0.8"/>

<!-- Warm horizon glow (dusk) -->
<ellipse cx="680" cy="440" rx="180" ry="55" fill="#e06010" opacity="0.12"/>

</svg>
